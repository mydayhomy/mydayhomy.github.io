name: Generate Editorial Hub Pages

on:
  workflow_dispatch:
    inputs:
      sitemap_url:
        description: 'Sitemap XML URL'
        required: true
        default: 'https://stylesdays.com/sitemap_index.xml'
        type: string
  schedule:
    - cron: '0 0 * * 0' # Weekly update

permissions:
  contents: write

jobs:
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Editorial Hub Generator
        run: python generate_pages.py "${{ github.event.inputs.sitemap_url || 'https://stylesdays.com/sitemap_index.xml' }}"

      - name: Commit and push generated static pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git status
          git diff-index --quiet HEAD || git commit -m "Auto-generate Pinterest-compliant editorial hub pages [skip ci]"
          git push
